# BIN MALIK FITNESS - local XAMPP vhost (not applied automatically; review first).
#
# Serves ONLY public/ on http://binmalikfitness.localhost:8090 (loopback, Require local).
# PHP 8.4 runs as a separate FastCGI process on 127.0.0.1:9084 (see start-fcgi.bat), so the
# global XAMPP PHP 8.2 module and the other local sites (VelaHost) are not touched.
#
# To apply:
#   1. Copy this file to C:\xampp\apache\conf\extra\httpd-binmalikfitness.conf
#   2. In C:\xampp\apache\conf\httpd.conf (back it up first):
#        - uncomment:  LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
#        - add at the end:  Include conf/extra/httpd-binmalikfitness.conf
#   3. Run start-fcgi.bat, then restart Apache from the XAMPP Control Panel.
#
# Not for cPanel: there, set the domain's document root to public/ and pick PHP 8.4 in MultiPHP.

Listen 127.0.0.1:8090

# The project-root .htaccess ("Require all denied") keeps the root closed under the default
# site (http://localhost/binmalikfitness/). This section only stops Apache reading it for
# requests handled by this vhost, so public/ can be served; the default site is unaffected.
<Directory "C:/xampp/htdocs/binmalikfitness">
    AllowOverride None
</Directory>

<VirtualHost 127.0.0.1:8090>
    ServerName binmalikfitness.localhost
    DocumentRoot "C:/xampp/htdocs/binmalikfitness/public"

    <Directory "C:/xampp/htdocs/binmalikfitness/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require local
        DirectoryIndex index.php
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9084"
    </FilesMatch>

    ErrorLog "logs/binmalikfitness-error.log"
    CustomLog "logs/binmalikfitness-access.log" combined
</VirtualHost>
